# Controller Manager configuration for Mujoco + Leg PD controller smoke testing.
controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    leg_pd_controller:
      type: leg_pd_controller/LegPdController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_main_imu"
    frame_id: "body_link"

leg_pd_controller:
  ros__parameters:
    update_rate: 1000
    joints:
      - lf_joint1
      - lf_joint2
      - lf_joint3
      - rf_joint1
      - rf_joint2
      - rf_joint3
      - lb_joint1
      - lb_joint2
      - lb_joint3
      - rb_joint1
      - rb_joint2
      - rb_joint3

    reference_interfaces:
      - effort

    state_interfaces:
      - position
      - velocity
      - effort
